# GDScript
[[language]]
name = "gdscript"
language-servers = ["gdscript-lsp"]

[language-server.gdscript-lsp]
command = "nc"
args = ["127.0.0.1", "6005"]
language-id = "gdscript"

# Nix
[[language]]
name = "nix"
auto-format = true
formatter = { command = "nixfmt" }

[language-server.rust-analyzer.config.inlayHints]
closingBraceHints.minLines = 10
closureReturnTypeHints.enable = "with_block"
discriminantHints.enable = "fieldless"
expressionAdjustmentHints.enable = "never"
expressionAdjustmentHints.hideOutsideUnsafe = false
expressionAdjustmentHints.mode = "prefer_prefix"
lifetimeElisionHints.enable = "skip_trivial"
typeHints.hideClosureInitialization = false

[language-server.rust-analyzer.config]
server.extraEnv = { "RA_MEMORY_LIMIT" = "4096" }  # MB
check.command = "clippy"

# lua (factorio)
[language-server.lua-language-server]
command = "lua-language-server"
[language-server.lua-language-server.config.Lua.workspace]
library = ["/etc/nixos/modules/home/cli/helix/factorio/"] # note: This should **NOT** be hardcoded. Instead it should be defined in helix.nix so you can auto-generate the path based on the machine
checkThirdParty = false
